<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Amplayo Store</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="nav">
    <div class="brand">
      <img src="logo.png" alt="Amplayo Store Logo" class="logo" />
    </div>
    <nav>
      <a href="#menu">MENU</a>
      <a href="#about">ABOUT</a>
      <button id="cartBtn" class="cart-btn">CART (<span id="cartCount">0</span>)</button>
    </nav>
  </header>

  <main>
    <section id="menu" class="menu">
      <h2>OUR MENU</h2>
      <div id="grid" class="grid"></div>
    </section>

    <section id="about" class="about">
      <h2>ABOUT AMPLAYO</h2>
      <p>We cook in small batches. Everything is made the day you order it. Good food, great mood.</p>
    </section>
  </main>

  <!-- Cart Panel with integrated Checkout Form -->
  <aside id="cartPanel" class="cart-panel hidden">
    <header>
      <h3>YOUR CART</h3>
      <button id="closeCart" aria-label="close">&times;</button>
    </header>
    
    <!-- Cart Items -->
    <div id="cartItems"></div>
    
    <!-- Checkout Form -->
    <div id="checkoutForm" style="display: none; padding: 1.5rem; border-top: 2px solid var(--bg);">
      <h4 style="margin: 0 0 1rem; font-size: 1.2rem;">DELIVERY DETAILS</h4>
      <input type="text" id="custName" placeholder="Full Name" style="width: 100%; padding: 0.8rem; margin-bottom: 0.8rem; border: 1px solid #ccc; border-radius: 8px; font-family: inherit;" required />
      <input type="tel" id="custPhone" placeholder="Phone Number" style="width: 100%; padding: 0.8rem; margin-bottom: 0.8rem; border: 1px solid #ccc; border-radius: 8px; font-family: inherit;" required />
      <textarea id="custAddress" placeholder="Delivery Address" rows="3" style="width: 100%; padding: 0.8rem; margin-bottom: 1rem; border: 1px solid #ccc; border-radius: 8px; font-family: inherit; resize: none;" required></textarea>
      <button id="submitOrderBtn" class="cta full" style="background: var(--red); color: #fff;">PLACE ORDER</button>
    </div>

    <footer id="cartFooter">
      <div class="total">Total: <span>₱<span id="cartTotal">0.00</span></span></div>
      <button id="checkoutBtn" class="cta full">CHECKOUT</button>
    </footer>
  </aside>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
